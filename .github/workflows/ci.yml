name: ci

on:
  push:
    # Both long-lived branches. Pull requests target phase-0/bootstrap, so a
    # trigger naming only main would leave every merge ungated on push.
    branches: [main, phase-0/bootstrap]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests benchmarks

      - name: Format check
        run: uv run ruff format --check src tests benchmarks

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not ml and not data"

  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install data and service dependencies
        run: uv sync --extra dev --extra data --extra service

      - name: Data tests with coverage gate
        run: >
          uv run pytest -m "not ml"
          --cov=ticketintel --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --extra dev

      # Audits the locked dependency set rather than the environment, so the
      # local editable package does not fail the strict run.
      - name: Export the locked requirements
        run: >
          uv export --no-emit-project --no-hashes
          --extra dev --extra data --extra service -o requirements-audit.txt

      - name: Audit dependencies
        run: uv run pip-audit --strict -r requirements-audit.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install data and ML dependencies for training
        run: uv sync --extra dev --extra data --extra ml

      # The image ships the trained TF-IDF classifiers. Without this step the
      # build would still succeed, but /triage would return 503 inside the
      # container. We train before building so the smoke test below can drive
      # a real prediction through the service.
      - name: Build the processed dataset
        run: uv run ticketintel data

      - name: Train the TF-IDF baseline
        run: uv run ticketintel baseline

      - name: Build the runtime image
        run: docker build --target runtime -t ticketintel:ci .

      # The gate has two parts. First the container must report status "ok"
      # (not "degraded") on /health, which means both the queue model and the
      # policy loaded. Then a real POST to /triage must return an action — a
      # curl against /health alone used to pass when the model was missing.
      - name: Gate on a real triage request
        run: |
          set -euo pipefail
          docker run -d --name ticketintel-ci -p 8000:8000 ticketintel:ci
          trap 'docker logs ticketintel-ci || true; docker rm -f ticketintel-ci || true' EXIT

          status=""
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/health 2>/dev/null); then
              status=$(printf '%s' "$body" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
              if [ "$status" = "ok" ]; then
                echo "health status: ok"
                break
              fi
            fi
            sleep 2
          done
          if [ "$status" != "ok" ]; then
            echo "the service never reported status ok (last status: ${status:-unreachable})"
            exit 1
          fi

          response=$(curl -fsS -X POST http://localhost:8000/triage \
            -H 'Content-Type: application/json' \
            -d '{"subject":"Password reset email never arrives","body":"I requested a reset twice and nothing came through.","summarize":false}')
          echo "triage response: $response"
          action=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["action"])')
          case "$action" in
            auto_route|human_review) echo "triage returned a valid action: $action" ;;
            *) echo "triage did not return a valid action: $action"; exit 1 ;;
          esac
