seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts: artifacts
  reports: reports

dataset:
  id: Tobi-Bueck/customer-support-tickets
  revision: ddf1c81a5475992c4fa6752bf1e8b4e31f07bbeb
  file: aa_dataset-tickets-multi-lang-5-2-50-version.csv
  language: en

split:
  train: 0.70
  validation: 0.10
  calibration: 0.10
  test: 0.10

dedup:
  # Near-duplicate detection: TF-IDF cosine similarity above this threshold
  # joins two tickets into the same group (section 3.2).
  near_duplicate_threshold: 0.90

# Queue held out entirely from training to probe novel-queue detection
# (ADR 0003, chosen in phase 1). A mid-volume queue keeps the main task intact.
novel_queue: Service Outages and Maintenance
