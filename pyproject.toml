[project]
name = "ticketintel"
version = "0.0.0"
description = "Support ticket routing, abstention and faithful summaries"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Hosna Hatami" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ticketintel = "ticketintel.cli:app"

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "datasets>=2.18",
    "sentence-transformers>=2.6",
    "torch>=2.2",
    "transformers>=4.39",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketintel"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: tests that require heavy ML dependencies or models",
]

[tool.coverage.run]
source = ["ticketintel"]
omit = ["src/ticketintel/ui/*"]
