[project]
name = "ticketintel"
version = "0.0.0"
description = "Support ticket routing, abstention and faithful summaries"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Hosna Hatami" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ticketintel = "ticketintel.cli:app"

[project.optional-dependencies]
# Lighter data-science stack used by the data pipeline and its tests. Kept
# separate from the transformer stack so CI can exercise the data tests without
# pulling in torch.
data = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "datasets>=2.18",
    "matplotlib>=3.8",
]
ml = [
    "ticketintel[data]",
    "sentence-transformers>=2.6",
    "torch>=2.2",
    "transformers>=4.39",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.11",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketintel"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# These ML libraries ship no type information; stubs exist for pandas and scipy
# (installed in the dev group) but not for these, so their imports are untyped.
[[tool.mypy.overrides]]
module = ["datasets.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: tests that require the transformer stack (torch, transformers)",
    "data: tests that require the data-science stack (pandas, scikit-learn)",
]

[tool.coverage.run]
source = ["ticketintel"]
omit = ["src/ticketintel/ui/*"]
